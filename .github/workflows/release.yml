# Push a tag like v0.1.0 to build downloads for every platform and publish
# them as a GitHub Release with the setup guide attached.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name=trendpilot_${VERSION}_${os}_${arch}
            mkdir -p "build/$name"
            exe=trendpilot; [ "$os" = windows ] && exe=trendpilot.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "build/$name/$exe" ./cmd/trendpilot
            cp docs/SETUP.md "build/$name/"
            # A double-clickable way to re-run the setup wizard.
            if [ "$os" = windows ]; then
              printf '@echo off\r\ncd /d "%%~dp0"\r\ntrendpilot.exe setup\r\npause\r\n' > "build/$name/Change settings.bat"
            else
              printf '#!/bin/sh\ncd "$(dirname "$0")" && ./trendpilot setup\n' > "build/$name/Change settings.command"
              chmod +x "build/$name/Change settings.command" "build/$name/trendpilot"
            fi
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "TrendPilot ${{ github.ref_name }}" \
            --notes-file docs/RELEASE_NOTES.md
